<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Jorge Toral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

    {% include theme-script.html %}
    {% include theme-style.html %}
</head>
<body class="flex min-h-screen">

    {% include sidebar.html %}

    <main class="flex-1 transition-all duration-500">

        <header class="h-16 flex justify-end items-center px-12 border-b border-theme sticky top-0 bg-[var(--header-bg)] backdrop-blur-md z-40 transition-colors duration-300">
            {% include lang-switch.html %}
        </header>

        {{ content }}
    </main>

</body>
</html>
{% include scripts.html %}
