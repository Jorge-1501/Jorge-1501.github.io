<style>
    :root {
        /* Paleta Otoño Profundo - Modo Claro */
        --bg-color: #FFF9F2; /* Hueso/Crema */
        --sidebar-bg: #2C362E; /* Verde Bosque Profundo */
        --sidebar-text: #E0D8C3;
        --text-main: #3E2723; /* Café Espresso */
        --text-muted: #795548;
        --accent: #A04523; /* Terracota */
        --header-bg: rgba(255, 249, 242, 0.8);
        --border: rgba(62, 39, 35, 0.1);
    }

    .dark {
        /* Paleta Otoño Profundo - Modo Oscuro */
        --bg-color: #1a1c1a; /* Negro pizarra verdoso */
        --sidebar-bg: #0d110e;
        --sidebar-text: #a4b3a7;
        --text-main: #e0d8c3; /* Crema suave */
        --text-muted: #a49d8c;
        --accent: #d87d52; /* Óxido claro */
        --header-bg: rgba(26, 28, 26, 0.8);
        --border: rgba(224, 216, 195, 0.1);
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        transition: background-color 0.3s, color 0.3s;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    .prose-container {
        max-width: 680px;
        margin: 0 auto;
    }

    .sidebar-theme { background-color: var(--sidebar-bg); color: var(--sidebar-text); }
    .border-theme { border-color: var(--border); }
    .accent-text { color: var(--accent); }

    /* Tipografía de artículos (proyecto-layout, contenido Markdown) */
    .article-content {
        color: var(--text-muted);
        font-size: 1.0625rem;
        line-height: 1.75;
        overflow-wrap: break-word;
    }

    .article-content > h1:first-child {
        font-size: clamp(2rem, 4vw + 1rem, 3rem);
        font-weight: 800;
        color: var(--accent);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
    }

    .article-content > h1:first-child + p {
        font-style: italic;
        color: var(--text-muted);
        opacity: 0.8;
        font-size: 1rem;
        margin-bottom: 2.5rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border);
    }

    .article-content h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.3;
        letter-spacing: -0.01em;
        margin-top: 3.5rem;
        margin-bottom: 1.25rem;
        padding-top: 1.75rem;
        border-top: 1px solid var(--border);
    }

    .article-content h3 {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text-main);
        line-height: 1.35;
        margin-top: 2.25rem;
        margin-bottom: 0.75rem;
    }

    /* Evita doble línea cuando un h2 sigue directamente a un separador */
    .article-content hr + h2 { border-top: none; padding-top: 0; margin-top: 0; }

    .article-content h2, .article-content h3 { scroll-margin-top: 8.5rem; }

    .article-content p { margin-bottom: 1.25rem; }

    /* Ecuaciones MathJax en bloque: scroll horizontal en pantallas angostas */
    .article-content mjx-container[display="true"] {
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
        padding: 0.25rem 0;
    }

    .article-content a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
        text-underline-offset: 2px;
    }
    .article-content a:hover { text-decoration-color: var(--accent); }

    .article-content strong { color: var(--text-main); font-weight: 700; }

    .article-content ul, .article-content ol { margin: 0 0 1.25rem 1.5rem; padding-left: 1rem; }
    .article-content ul { list-style: disc; }
    .article-content ol { list-style: decimal; }
    .article-content li { margin-bottom: 0.5rem; }

    .article-content blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 1rem;
        font-style: italic;
        opacity: 0.85;
        margin: 1.5rem 0;
    }

    .article-content code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        background: color-mix(in srgb, var(--text-main) 8%, transparent);
        padding: 0.15em 0.4em;
        border-radius: 3px;
    }
    .article-content pre {
        overflow-x: auto;
        padding: 1rem;
        background: color-mix(in srgb, var(--text-main) 6%, transparent);
        border-radius: 4px;
        margin-bottom: 1.5rem;
    }
    .article-content pre code { background: none; padding: 0; }

    .article-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 1.5rem 0; }
    
    .article-content {
        counter-reset: figure-counter;
    }
    
    .article-content figure {
        counter-increment: figure-counter;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 2rem 0;
        width: 100%;
    }
    .article-content figure img {
        margin: 0;
    }
    .article-content figcaption {
        font-size: 0.85rem;
        font-style: italic;
        color: var(--text-muted);
        margin-top: 0.75rem;
        text-align: center;
        line-height: 1.5;
        max-width: 90%;
    }
    html[lang="es"] .article-content figcaption::before {
        content: "Figura " counter(figure-counter) ": ";
        font-weight: bold;
        color: var(--text-main);
    }
    html[lang="en"] .article-content figcaption::before {
        content: "Figure " counter(figure-counter) ": ";
        font-weight: bold;
        color: var(--text-main);
    }
    .article-content hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

    /* Tablas: scroll horizontal en móvil, cifras alineadas y filas alternas */
    .article-content table {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 1.75rem 0 2rem;
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
    }
    .article-content th, .article-content td { border-bottom: 1px solid var(--border); padding: 0.55rem 0.85rem; text-align: left; }
    .article-content th {
        background: color-mix(in srgb, var(--text-main) 6%, transparent);
        color: var(--text-main);
        font-weight: 700;
        border-bottom: 2px solid color-mix(in srgb, var(--text-main) 20%, transparent);
        white-space: nowrap;
    }
    .article-content td:not(:first-child) { white-space: nowrap; }
    .article-content tbody tr:nth-child(even) { background: color-mix(in srgb, var(--text-main) 3%, transparent); }

    /* Bibliografía numerada */
    .article-content ol.references {
        list-style: decimal;
        margin: 1rem 0 2rem 0;
        padding-left: 2rem;
        font-size: 0.875rem;
        line-height: 1.55;
    }
    .article-content ol.references li {
        margin-bottom: 0.85rem;
        padding-left: 0.35rem;
        word-break: break-word;
    }
    .article-content ol.references li::marker {
        color: var(--text-main);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }
    .article-content ol.references + p { font-size: 0.85rem; opacity: 0.85; }
</style>
